site_name: Accelerate AI Agents Development with the Foundry Toolkit
site_author: Carlotta Castelluccio
site_description: Learn how to accelerate the development of AI agents using the Foundry Toolkit in VS Code.
site_url: https://carlotta94c.github.io/accelerate-ai-agents-development-with-gh-models-and-ai-toolkit/

# Repository ..................................................
repo_name: Accelerate AI Agents Development with the Foundry Toolkit
repo_url: https://github.com/carlotta94c/accelerate-ai-agents-development-with-gh-models-and-ai-toolkit


# Copyright ...................................................
copyright: >
  Copyright &copy; 2023 - present Microsoft

nav:
  - Home: index.md
  - Getting Started: 01_Get_Started.md
  - Agent Building: 02_Agent_Building.md
  - Human Evaluations: 03_Human_Evaluations.md
  - AI-Assisted Evaluations: 04_AI_Assisted_Evaluations.md
  - Summary: 05_Summary.md

plugins:
  - glightbox
  - include-markdown
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true

theme:
  name: material
  features:
    - navigation.footer
    - content.code.copy
    - navigation.tabs.sticky
    - content.tabs.link

  font:
    text: Roboto

  palette:
    - scheme: default
      primary: black
      accent: pink
      toggle:
        icon: material/brightness-2
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 2
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

# extra_javascript:
  # - js/custom.js

extra_css:
  - css/custom.css
